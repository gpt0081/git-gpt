<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fjordfall</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#153843;color:#eef5ec;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px}.panel{background:#10252dcc;border:1px solid #ffffff22;border-radius:14px;padding:8px 12px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0006}.row{display:flex;gap:8px;align-items:center}.btn{pointer-events:auto;border:1px solid #ffffff33;background:#ffffff12;color:white;border-radius:12px;padding:10px 14px;font-weight:700}.btn:active{transform:scale(.97)}#squads{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.s{min-width:92px;text-align:left}.s.sel{outline:3px solid #f1d36d;background:#f1d36d22}.hp{height:5px;background:#0006;border-radius:5px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:#dce9c8}.title{font-weight:900;letter-spacing:.05em}.small{font-size:12px;opacity:.8}#msg{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-weight:800;text-shadow:0 2px 8px #000;white-space:nowrap}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#183e49dd,#091b20ee);z-index:4}.card{width:min(520px,90vw);padding:26px;border-radius:24px;text-align:center;background:#10252ddd;border:1px solid #ffffff25;box-shadow:0 24px 80px #0008}.card h1{font-size:clamp(42px,11vw,82px);margin:0;letter-spacing:-.06em}.card p{line-height:1.55;color:#c8dad4}.start{font-size:18px;padding:14px 28px;background:#e2c967;color:#17242a}.hide{display:none!important}</style><body><canvas id="c"></canvas><div id="hud"><div id="top"><div class="panel"><div class="title">FJORDFALL</div><div class="small">섬 방어 전술 테스트 APK</div></div><div class="panel row"><span>웨이브 <b id="wave">1</b></span><span>적 <b id="enemy">0</b></span><button class="btn" id="pause">Ⅱ</button></div></div><div id="msg">분대를 누른 뒤 섬 위 목적지를 터치하세요</div><div id="squads"></div></div><div id="overlay"><div class="card"><h1>FJORDFALL</h1><p>분대를 선택하고 섬 위를 터치해 이동하십시오. 상륙하는 적을 모두 막으면 다음 웨이브로 넘어갑니다.</p><button class="btn start" id="start">전투 시작</button></div></div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),D=Math.PI*2;let W,H,sc=1,last=0,run=false,paused=false,wave=1,sel=0,spawn=0,remain=6,enemies=[],boats=[],parts=[];const island={x:0,y:0,rx:0,ry:0};const squads=[{n:'검병',col:'#d8d1ba',x:0,y:0,tx:0,ty:0,hp:100,max:100,r:22,spd:115,cd:0},{n:'창병',col:'#c4d4bd',x:0,y:0,tx:0,ty:0,hp:100,max:100,r:22,spd:100,cd:0},{n:'궁병',col:'#d7bc83',x:0,y:0,tx:0,ty:0,hp:85,max:85,r:22,spd:105,cd:0}];function resize(){sc=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*sc;c.height=H*sc;x.setTransform(sc,0,0,sc,0,0);island.x=W*.5;island.y=H*.54;island.rx=Math.min(W*.35,350);island.ry=Math.min(H*.34,230);squads.forEach((s,i)=>{if(!s.x){s.x=island.x+(i-1)*90;s.y=island.y+40;s.tx=s.x;s.ty=s.y}})}addEventListener('resize',resize);resize();function inside(px,py){let dx=(px-island.x)/island.rx,dy=(py-island.y)/island.ry;return dx*dx+dy*dy<.82}function clampIsland(px,py){let dx=px-island.x,dy=py-island.y,q=Math.sqrt(dx*dx/(island.rx*.86)**2+dy*dy/(island.ry*.82)**2);return q>1?{x:island.x+dx/q,y:island.y+dy/q}:{x:px,y:py}}function point(ev){let r=c.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev;return{x:t.clientX-r.left,y:t.clientY-r.top}}c.addEventListener('pointerdown',e=>{if(!run||paused)return;let p=point(e),hit=squads.findIndex(s=>Math.hypot(s.x-p.x,s.y-p.y)<35);if(hit>=0){sel=hit;renderUI();return}if(inside(p.x,p.y)){let q=clampIsland(p.x,p.y);squads[sel].tx=q.x;squads[sel].ty=q.y;burst(q.x,q.y,'#f3dc82',8)}});function spawnBoat(){let side=Math.floor(Math.random()*4),bx,by;if(side===0){bx=-50;by=H*(.2+Math.random()*.6)}if(side===1){bx=W+50;by=H*(.2+Math.random()*.6)}if(side===2){bx=W*(.15+Math.random()*.7);by=-45}if(side===3){bx=W*(.15+Math.random()*.7);by=H+45}let a=Math.atan2(island.y-by,island.x-bx),tx=island.x+Math.cos(a)*island.rx*.82,ty=island.y+Math.sin(a)*island.ry*.82;boats.push({x:bx,y:by,tx,ty,a,spd:58+wave*3,n:2+Math.floor(wave/2)})}function land(b){for(let i=0;i<b.n;i++){enemies.push({x:b.x+Math.random()*12-6,y:b.y+Math.random()*12-6,hp:22+wave*3,max:22+wave*3,r:14,spd:38+wave*2,cd:Math.random()})}burst(b.x,b.y,'#dce7df',16)}function burst(px,py,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,l:.5+Math.random()*.5,col})}function update(dt){if(!run||paused)return;spawn-=dt;if(remain>0&&spawn<=0){spawn=2.7-Math.min(1.2,wave*.08);spawnBoat();remain--}boats.forEach(b=>{let a=Math.atan2(b.ty-b.y,b.tx-b.x);b.x+=Math.cos(a)*b.spd*dt;b.y+=Math.sin(a)*b.spd*dt;b.a=a});for(let i=boats.length-1;i>=0;i--)if(Math.hypot(boats[i].x-boats[i].tx,boats[i].y-boats[i].ty)<12){land(boats[i]);boats.splice(i,1)}squads.forEach(s=>{s.cd-=dt;let d=Math.hypot(s.tx-s.x,s.ty-s.y);if(d>3){s.x+=(s.tx-s.x)/d*s.spd*dt;s.y+=(s.ty-s.y)/d*s.spd*dt}let target=null,md=s.n==='궁병'?190:48;for(const e of enemies){let q=Math.hypot(e.x-s.x,e.y-s.y);if(q<md){target=e;md=q}}if(target&&s.cd<=0){s.cd=s.n==='궁병'?.8:.45;target.hp-=s.n==='창병'?15:s.n==='궁병'?11:10;burst(target.x,target.y,s.col,4)}});enemies.forEach(e=>{e.cd-=dt;let target=null,md=1e9;for(const s of squads){if(s.hp<=0)continue;let q=Math.hypot(s.x-e.x,s.y-e.y);if(q<md){md=q;target=s}}if(!target)return;if(md>e.r+target.r){e.x+=(target.x-e.x)/md*e.spd*dt;e.y+=(target.y-e.y)/md*e.spd*dt}else if(e.cd<=0){e.cd=.8;target.hp-=4+wave*.35;burst(target.x,target.y,'#a54645',5)}});for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){burst(enemies[i].x,enemies[i].y,'#733f46',10);enemies.splice(i,1)}parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=45*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);if(squads.every(s=>s.hp<=0)){run=false;document.querySelector('#overlay').classList.remove('hide');document.querySelector('.card').innerHTML='<h1>패배</h1><p>섬이 함락되었습니다.</p><button class="btn start" onclick="location.reload()">다시 시작</button>'}else if(remain===0&&!boats.length&&!enemies.length){wave++;remain=5+wave*2;spawn=2;squads.forEach(s=>s.hp=Math.min(s.max,s.hp+18));document.querySelector('#msg').textContent=`웨이브 ${wave} 접근 중`;setTimeout(()=>document.querySelector('#msg').textContent='상륙 지점을 예측해 분대를 배치하세요',1600)}renderUI()}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3f7c89');g.addColorStop(1,'#173f4a');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.15;x.strokeStyle='#d9eef0';for(let y=(performance.now()*.02)%42-42;y<H;y+=42){x.beginPath();for(let xx=0;xx<W;xx+=12)x.lineTo(xx,y+Math.sin(xx*.03+y*.02)*5);x.stroke()}x.globalAlpha=1;x.save();x.translate(island.x,island.y);x.fillStyle='#183b43';x.beginPath();x.ellipse(0,18,island.rx*1.03,island.ry*1.03,0,0,D);x.fill();x.fillStyle='#d7ddc4';x.beginPath();x.ellipse(0,0,island.rx,island.ry,0,0,D);x.fill();x.fillStyle='#8da77d';x.beginPath();x.ellipse(-20,-12,island.rx*.78,island.ry*.73,-.08,0,D);x.fill();x.fillStyle='#697f64';for(let i=0;i<22;i++){let a=i*.7,r=(i%5)/5;x.beginPath();x.arc(Math.cos(a)*island.rx*.68*r,Math.sin(a)*island.ry*.62*r,5+(i%4)*3,0,D);x.fill()}x.fillStyle='#a47758';for(let i=0;i<3;i++){let hx=-100+i*100,hy=-20+(i%2)*55;x.fillRect(hx-18,hy-14,36,28);x.fillStyle='#5c3333';x.beginPath();x.moveTo(hx-24,hy-14);x.lineTo(hx,hy-35);x.lineTo(hx+24,hy-14);x.fill();x.fillStyle='#a47758'}x.restore();boats.forEach(b=>{x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillStyle='#60483b';x.beginPath();x.moveTo(-24,-9);x.lineTo(28,0);x.lineTo(-24,9);x.closePath();x.fill();x.fillStyle='#d3c7a4';x.fillRect(-4,-22,3,38);x.restore()});enemies.forEach(e=>unit(e,'#74424b','⚔'));squads.forEach((s,i)=>{if(s.hp<=0)return;unit(s,s.col,i===sel?'◆':'●');if(i===sel){x.strokeStyle='#f1d36d';x.lineWidth=3;x.beginPath();x.arc(s.x,s.y,s.r+8,0,D);x.stroke()}});parts.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1}function unit(u,col,sym){x.fillStyle='#10242a88';x.beginPath();x.ellipse(u.x,u.y+10,u.r*.9,u.r*.35,0,0,D);x.fill();x.fillStyle=col;x.beginPath();x.arc(u.x,u.y,u.r,0,D);x.fill();x.fillStyle='#17262a';x.font='bold 15px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(sym,u.x,u.y);x.fillStyle='#0007';x.fillRect(u.x-u.r,u.y-u.r-9,u.r*2,4);x.fillStyle='#dceacb';x.fillRect(u.x-u.r,u.y-u.r-9,u.r*2*Math.max(0,u.hp/u.max),4)}function renderUI(){document.querySelector('#wave').textContent=wave;document.querySelector('#enemy').textContent=enemies.length+boats.reduce((a,b)=>a+b.n,0);document.querySelector('#squads').innerHTML=squads.map((s,i)=>`<button class="btn s ${i===sel?'sel':''}" data-i="${i}" ${s.hp<=0?'disabled':''}><b>${s.n}</b><div class="small">체력 ${Math.max(0,Math.ceil(s.hp))}</div><div class="hp"><i style="width:${Math.max(0,s.hp/s.max*100)}%"></i></div></button>`).join('');document.querySelectorAll('.s').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;renderUI()})}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}document.querySelector('#start').onclick=()=>{document.querySelector('#overlay').classList.add('hide');run=true;spawn=.5;renderUI()};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';document.querySelector('#msg').textContent=paused?'일시정지':'분대를 누른 뒤 목적지를 터치하세요'};renderUI();requestAnimationFrame(loop)})();</script></body></html>
